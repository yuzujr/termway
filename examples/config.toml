# Copy this file to ~/.config/termway/config.toml and edit it freely.
# Every action is an argv array: no shell is involved unless you explicitly
# use a command such as ["sh", "-lc", "..."].

# Optional default when --output is omitted. Without this, termway uses niri's focused output.
# output = "DP-1"

[graphics]
# These are the only graphics settings most people need. They match the in-app `g` menu.
# quality: auto (recommended), sharp (fixed detail), or fast (favor responsiveness).
quality = "auto"
# Named values: 720p, 1080p, 1440p, 2160p/4k, native; custom WIDTHxHEIGHT also works.
resolution = "1080p"

# Advanced tuning — leave this entire table commented unless measurements show a real need.
# [graphics.advanced]
# adaptive_min_height = 360
# adaptive_damage_frames = 2
# adaptive_damage_window_ms = 500
# frame_budget_ms = 275
# recovery_ms = 2000
# preview_ms = 120
# atlas_refresh_ms = 2000
# tmux_bandwidth_mbps = 40.0

[[actions]]
name = "terminal"
description = "Open Kitty"
command = ["kitty", "--single-instance"]

[[actions]]
name = "launcher"
description = "Toggle the Noctalia application launcher"
command = ["noctalia", "msg", "panel-toggle", "launcher"]

[[actions]]
name = "clipboard"
description = "Toggle the Noctalia clipboard"
command = ["noctalia", "msg", "panel-toggle", "clipboard"]

[[actions]]
name = "files"
description = "Open Dolphin"
command = ["dolphin"]

[[actions]]
name = "browser"
description = "Open Google Chrome"
command = ["google-chrome"]

# niri integration is optional: these are ordinary commands, not built-ins.
[[actions]]
name = "overview"
description = "Toggle the niri overview"
command = ["niri", "msg", "action", "toggle-overview"]

[[actions]]
name = "close-window"
description = "Close the focused niri window"
command = ["niri", "msg", "action", "close-window"]

[[actions]]
name = "toggle-floating"
description = "Toggle the focused niri window between floating and tiling"
command = ["niri", "msg", "action", "toggle-window-floating"]

[[actions]]
name = "fullscreen"
description = "Toggle fullscreen on the focused niri window"
command = ["niri", "msg", "action", "fullscreen-window"]

[[actions]]
name = "maximize-column"
description = "Toggle the maximized niri column"
command = ["niri", "msg", "action", "maximize-column"]

[[actions]]
name = "focus-window-previous"
description = "Focus the previously focused niri window"
command = ["niri", "msg", "action", "focus-window-previous"]

[[actions]]
name = "focus-column-left"
description = "Focus the niri column to the left"
command = ["niri", "msg", "action", "focus-column-left"]

[[actions]]
name = "focus-column-right"
description = "Focus the niri column to the right"
command = ["niri", "msg", "action", "focus-column-right"]

[[actions]]
name = "focus-window-up"
description = "Focus the niri window above"
command = ["niri", "msg", "action", "focus-window-up"]

[[actions]]
name = "focus-window-down"
description = "Focus the niri window below"
command = ["niri", "msg", "action", "focus-window-down"]

[[actions]]
name = "workspace-up"
description = "Focus the niri workspace above"
command = ["niri", "msg", "action", "focus-workspace-up"]

[[actions]]
name = "workspace-down"
description = "Focus the niri workspace below"
command = ["niri", "msg", "action", "focus-workspace-down"]
